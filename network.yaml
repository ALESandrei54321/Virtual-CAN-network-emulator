# network.yaml
bus:
  protocol: CAN_FD
  nominal_bit_rate: 500000
  data_bit_rate: 2000000

ecus:
  - id: engine_ecu
    firmware: firmware/engine_ecu/main.py
    filters:
      - 0x02F
      - 0x01A
      - 0x06D
      - 0x1B8
      - 0x1C9

  - id: chassis_ecu
    firmware: firmware/chassis_ecu/main.py
    filters:
      - 0x043
      - 0x039
      - 0x1D3
      - 0x7FF

  - id: body_ecu
    firmware: firmware/body_ecu/main.py
    filters:
      - 0x083
      - 0x098
      - 0x1A7
      - 0x1B1
      - 0x25C
      - 0x271
      - 0x286
      - 0x29C
      - 0x2B1
      - 0x16F

  - id: gateway_ecu
    firmware: firmware/gateway_ecu/main.py
    filters:
      - 0x043
      - 0x19A
      - 0x077
      - 0x1D3
      - 0x16F
      - 0x08D
      - 0x1BB