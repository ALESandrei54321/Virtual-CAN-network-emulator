# network.yaml
bus:
  protocol: CAN
  bit_rate: 500000

ecus:
  - id: engine_ecu
    firmware: firmware/engine_ecu/main.py
    filters:
      - 0x02F
      - 0x01A
      - 0x06D
      - 0x1B8
      - 0x1C9

  - id: chassis_ecu
    firmware: firmware/chassis_ecu/main.py
    filters:
      - 0x043
      - 0x039
      - 0x1D3

  - id: body_ecu
    firmware: firmware/body_ecu/main.py
    filters:
      - 0x083
      - 0x098
      - 0x1A7
      - 0x1B1
      - 0x25C
      - 0x271
      - 0x286
      - 0x29C
      - 0x2B1
      - 0x16F