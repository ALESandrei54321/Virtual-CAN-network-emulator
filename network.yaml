# network.yaml
bus:
  protocol: CAN
  bit_rate: 500000

ecus:
  - id: engine_ecu
    firmware: firmware/engine_ecu/main.py
    filters:
      - 0x100
      - 0x101
      - 0x102

  - id: chassis_ecu
    firmware: firmware/chassis_ecu/main.py
    filters:
      - 0x110
      - 0x200
      - 0x201
      - 0x202
      - 0x203
      - 0x204

  - id: body_ecu
    firmware: firmware/body_ecu/main.py
    filters:
      - 0x212
      - 0x300
      - 0x301
      - 0x302
      - 0x303